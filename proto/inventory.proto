syntax = "proto3";

package inventory;

option java_multiple_files = true;
option java_package = "com.ecommerce.inventory.proto";
option java_outer_classname = "InventoryProto";

// Inventory service contract
service InventoryService {

  // Get available quantity for one product
  rpc GetStock (GetStockRequest) returns (GetStockResponse);

  // Reserve atomically. Repeating an ACTIVE reservation ID with identical items
  // succeeds without reserving again. Changed items or finalized IDs are rejected.
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);

  // Release a previous reservation
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);

  rpc AddStock (AddStockRequest) returns (AddStockResponse);
  rpc InitializeStock (AddStockRequest) returns (AddStockResponse);

  // Permanently commit a reservation and deduct stock
  rpc CommitReservation (CommitReservationRequest)  
    returns (CommitReservationResponse);
}

message GetStockRequest {
  int64 product_id = 1;
}

message GetStockResponse {
  int64 product_id = 1;
  int32 available_quantity = 2;
}

message StockItem {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string reservation_id = 1;
  repeated StockItem items = 2;
}

message ReserveStockResponse {
  bool success = 1;
  string message = 2;
  string reservation_id = 3;
}

message ReleaseStockRequest {
  string reservation_id = 1;
}

message ReleaseStockResponse {
  bool success = 1;
  string message = 2;
}
message AddStockRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}

message AddStockResponse {
  bool success = 1;
  string message = 2;
  int64 product_id = 3;
  int32 available_quantity = 4;
}

message CommitReservationRequest {
  string reservation_id = 1;
}

message CommitReservationResponse {
  bool success = 1;
  string message = 2;
}
