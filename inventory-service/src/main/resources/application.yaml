
spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce_inventory}
    username: ${DB_USERNAME:inventory_user}
    password: ${DB_PASSWORD:inventory_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  grpc:
    server:
      port: 9090
