name: ecommerce2026

services:

  mysql:
    image: mysql:8.4
    container_name: ecommerce2026-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: ecommerce_main
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_dev_password

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - ecommerce_network
      

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -proot_dev_password
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  inventory-db:
    image: postgres:16
    container_name: ecommerce2026-inventory-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce_inventory
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ecommerce_network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U inventory_user -d ecommerce_inventory
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: ecommerce2026-app
    scale: 3
    build:
      context: ./main-app/laravel
      dockerfile: Dockerfile
    restart: unless-stopped


    env_file:
      - ./main-app/laravel/.env

    environment:
      SESSION_DRIVER: ${STOREFRONT_SESSION_DRIVER:-database}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommerce_main
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: ecommerce_dev_password

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - ecommerce_network
      - proxy_network

    volumes:
      - ./main-app/laravel:/var/www
      - laravel_vendor:/var/www/vendor



  nginx:
    image: nginx:1.28-alpine
    container_name: ecommerce2026-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app

    networks:
      proxy_network:
        ipv4_address: 172.30.250.2



  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: ecommerce2026-inventory-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/ecommerce_inventory
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_dev_password

    ports:
      - "127.0.0.1:9090:9090"

    depends_on:
      inventory-db:
        condition: service_healthy

    networks:
      - ecommerce_network

  checkout-recovery:
    image: ecommerce2026-app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]

    env_file:
      - ./main-app/laravel/.env

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommerce_main
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: ecommerce_dev_password

    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_started

    networks:
      - ecommerce_network

    volumes:
      - ./main-app/laravel:/var/www
      - laravel_vendor:/var/www/vendor

  notification-worker:
    image: ecommerce2026-app
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - notifications
      - --queue=notifications
      - --sleep=2
      - --tries=0
      - --timeout=90
      - --max-time=3600

    env_file:
      - ./main-app/laravel/.env

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommerce_main
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: ecommerce_dev_password

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - ecommerce_network

    volumes:
      - ./main-app/laravel:/var/www
      - laravel_vendor:/var/www/vendor

  order-email-worker:
    image: ecommerce2026-app
    restart: unless-stopped
    stop_grace_period: 150s
    command: ["php", "artisan", "orders:consume-emails"]

    env_file:
      - ./main-app/laravel/.env

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommerce_main
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: ecommerce_dev_password

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - ecommerce_network

    volumes:
      - ./main-app/laravel:/var/www
      - laravel_vendor:/var/www/vendor

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ecommerce2026-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ecommerce_user
      RABBITMQ_DEFAULT_PASS: rabbitmq_dev_password
      RABBITMQ_DEFAULT_VHOST: ecommerce

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - ecommerce_network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reverb:
    image: ecommerce2026-app
    restart: unless-stopped
    working_dir: /var/www

    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080

    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - ./main-app/laravel/.env

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommerce_main
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: ecommerce_dev_password

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - ecommerce_network

    volumes:
      - ./main-app/laravel:/var/www
      - laravel_vendor:/var/www/vendor

volumes:
  mysql_data:
    name: ecommerce2026_mysql_data

  postgres_data:
    name: ecommerce2026_postgres_data

  laravel_vendor:
    name: ecommerce2026_laravel_vendor

  rabbitmq_data:
    name: ecommerce2026_rabbitmq_data

networks:
  ecommerce_network:
    name: ecommerce2026_network
    driver: bridge

  proxy_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/24
          ip_range: 172.30.250.128/25
